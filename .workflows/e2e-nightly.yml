# Nightly e2e against the real GNOME 50 host (plan §5.3), on Spaces.
#
# Runs on the spacer host runner (label macos): this Mac is on the same network as the GNOME
# host and has the SSH key for `homelab@10.1.2.40`. The tests reach the host through SSH local
# forwards (`ssh -N -L 1339x:localhost:339x`, required by macOS Local Network Privacy, plan
# §1.9). The GitHub copy (.github/workflows/e2e-nightly.yml) is what `cargo xtask workflows`
# audits; keep the two in step.
#
# Credentials come from the Spaces repository secrets DRIFT_E2E_* and never appear in the
# repository; `cargo xtask e2e` pipes the run through a redact layer.
name: e2e-nightly

on:
  schedule:
    # 04:17 UTC, after the nightly fuzz run.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      bench:
        description: "Enforce the M9-1 performance budgets (needs an otherwise idle host)"
        type: boolean
        default: false

concurrency:
  # One run at a time: the suite shares one GNOME host and one daemon per mode.
  group: e2e-nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  DRIFT_E2E_SSH: ${{ vars.DRIFT_E2E_SSH || 'homelab@10.1.2.40' }}

jobs:
  e2e:
    name: cargo xtask e2e (macOS host runner, SSH to the GNOME host)
    runs-on: macos
    timeout-minutes: 90
    steps:
      # Fail before the build when the repository secrets are not set.
      - name: Secrets present
        env:
          DRIFT_E2E_SYS_USER: ${{ secrets.DRIFT_E2E_SYS_USER }}
          DRIFT_E2E_SYS_PASS: ${{ secrets.DRIFT_E2E_SYS_PASS }}
          DRIFT_E2E_LOGIN_USER: ${{ secrets.DRIFT_E2E_LOGIN_USER }}
          DRIFT_E2E_LOGIN_PASS: ${{ secrets.DRIFT_E2E_LOGIN_PASS }}
          DRIFT_E2E_HL_USER: ${{ secrets.DRIFT_E2E_HL_USER }}
          DRIFT_E2E_HL_PASS: ${{ secrets.DRIFT_E2E_HL_PASS }}
          DRIFT_E2E_HL1_USER: ${{ secrets.DRIFT_E2E_HL1_USER }}
          DRIFT_E2E_HL1_PASS: ${{ secrets.DRIFT_E2E_HL1_PASS }}
          DRIFT_E2E_SHARE_USER: ${{ secrets.DRIFT_E2E_SHARE_USER }}
          DRIFT_E2E_SHARE_PASS: ${{ secrets.DRIFT_E2E_SHARE_PASS }}
        run: |
          missing=""
          for v in SYS LOGIN HL HL1 SHARE; do
            for k in USER PASS; do
              n="DRIFT_E2E_${v}_${k}"
              eval "val=\${$n:-}"
              [ -n "$val" ] || missing="$missing $n"
            done
          done
          [ -z "$missing" ] || { echo "missing Spaces secrets:$missing"; exit 1; }

      - uses: actions/checkout@v4

      # Spaces has LFS turned off, so the fixtures come from the public GitHub mirror.
      - name: LFS fixtures
        run: |
          git lfs install --local
          git -c lfs.url=https://github.com/HutsonLabs/drift.git/info/lfs lfs pull

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Build the webview bundle (cargo builds embed ui/dist)
        run: |
          cd ui
          bun install --frozen-lockfile
          bun run build

      - name: Check the GNOME host is configured (plan M0-4)
        run: cargo xtask host-setup-check

      - name: cargo xtask e2e
        env:
          DRIFT_E2E_SYS_USER: ${{ secrets.DRIFT_E2E_SYS_USER }}
          DRIFT_E2E_SYS_PASS: ${{ secrets.DRIFT_E2E_SYS_PASS }}
          DRIFT_E2E_LOGIN_USER: ${{ secrets.DRIFT_E2E_LOGIN_USER }}
          DRIFT_E2E_LOGIN_PASS: ${{ secrets.DRIFT_E2E_LOGIN_PASS }}
          DRIFT_E2E_HL_USER: ${{ secrets.DRIFT_E2E_HL_USER }}
          DRIFT_E2E_HL_PASS: ${{ secrets.DRIFT_E2E_HL_PASS }}
          DRIFT_E2E_HL1_USER: ${{ secrets.DRIFT_E2E_HL1_USER }}
          DRIFT_E2E_HL1_PASS: ${{ secrets.DRIFT_E2E_HL1_PASS }}
          DRIFT_E2E_SHARE_USER: ${{ secrets.DRIFT_E2E_SHARE_USER }}
          DRIFT_E2E_SHARE_PASS: ${{ secrets.DRIFT_E2E_SHARE_PASS }}
          # Plan M9-1: the fps budget is only asserted in bench mode, on an idle host.
          DRIFT_E2E_BENCH: ${{ inputs.bench && '1' || '' }}
        run: cargo xtask e2e

      - name: Leave no SSH forwards behind
        if: always()
        run: pkill -f "ssh -N .*:localhost:339" || true
