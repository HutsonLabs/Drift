[package]
name = "drift-host"
description = "Drift Host: the Mac RDP host (listener, one session, test-pattern display; capture, encode and injection plug in later)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "drift-host"
path = "src/main.rs"

[dependencies]
drift-apple.workspace = true
drift-clipboard.workspace = true
drift-core.workspace = true
drift-ext.workspace = true
# Screen capture (HOST-3), injection (HOST-6), the keymap and the Mac's keyboard type.
drift-capture.workspace = true
drift-inject.workspace = true
drift-input.workspace = true
drift-macos.workspace = true
# The VideoToolbox H.264 encoder: the real-time profile for the screen (HOST-4) and the test pattern.
drift-video.workspace = true
ironrdp-core.workspace = true
ironrdp-displaycontrol.workspace = true
ironrdp-dvc.workspace = true
ironrdp-egfx.workspace = true
ironrdp-cliprdr.workspace = true
ironrdp-pdu.workspace = true
ironrdp-rdpsnd.workspace = true
ironrdp-server = { workspace = true, features = ["egfx"] }
ironrdp-svc.workspace = true
async-trait = "0.1"
libc.workspace = true
# The host's self-signed certificate (generated once, pinned by paired devices in HOST-8).
rcgen.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "sync", "macros", "time"] }
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

# HOST-10: the private CGVirtualDisplay API through the Objective-C runtime.
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSString"] }

[dev-dependencies]
drift-gfx.workspace = true
drift-ext.workspace = true
drift-rdp.workspace = true
drift-testkit.workspace = true
tempfile.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
