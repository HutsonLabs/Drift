[package]
name = "drift-macos"
description = "macOS platform layer for Drift: RemoteView NSView, cursor, occlusion, network/sleep monitoring, Keychain, Local Network errors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
## Thin helpers taking a `tauri::Window` and its page `tauri::Webview` (attach the RemoteView below the WKWebView,
## hide/show the webview). Enabled by drift-app.
tauri = ["dep:tauri"]
## AppKit window tests that need a real window server session
## (`cargo test -p drift-macos --features macos-ui-tests --test windows_ui`).
macos-ui-tests = []

[dependencies]
drift-apple.workspace = true
drift-core.workspace = true
drift-input.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
objc2.workspace = true
block2.workspace = true
dispatch2 = "0.3.1"
objc2-foundation.workspace = true
objc2-quartz-core = { workspace = true, features = ["objc2-core-foundation"] }
objc2-core-foundation.workspace = true
# `macos-private-api`: the transparent page over the live picture (ADR M7-3) needs wry's
# private `drawsBackground` key, which only macOS needs. Enabling it here, in the macOS-only
# platform crate, keeps it out of iOS builds (ADR STORE-2); tauri-build only checks drift-app's
# own `tauri` entry.
tauri = { workspace = true, optional = true, features = ["macos-private-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true

[dev-dependencies]
drift-testkit.workspace = true
proptest.workspace = true
tempfile.workspace = true

# AppKit smoke tests must run on the process main thread (views and windows are
# main-thread-only), so they use a tiny libtest-compatible harness (tests/support/harness.rs).
[[test]]
name = "appkit"
harness = false

[[test]]
name = "windows_ui"
harness = false

[lints]
workspace = true
