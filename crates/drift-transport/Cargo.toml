[package]
name = "drift-transport"
description = "Drift-to-Drift transports: RDP over QUIC with a stream per GFX frame, the transport order (QUIC first with a paired Drift Host, TCP otherwise) and a lossy-link proxy for measurements."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
drift-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util", "macros"] }
# QUIC for Drift-to-Drift sessions (ADR HOST-12-quic-transport): rustls with the ring provider,
# like the RDP TLS path; no platform verifier (the host certificate is pinned).
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }

[dev-dependencies]
drift-testkit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
# The measurement example: MS-RDPEUDP2 over UDP, from the vendored IronRDP tree.
ironrdp-rdpeudp-tokio = { path = "../../third_party/ironrdp/crates/ironrdp-rdpeudp-tokio" }
ironrdp-rdpeudp = { path = "../../third_party/ironrdp/crates/ironrdp-rdpeudp" }
ironrdp-rdpemt = { path = "../../third_party/ironrdp/crates/ironrdp-rdpemt" }
tokio-rustls.workspace = true


[lints]
workspace = true
