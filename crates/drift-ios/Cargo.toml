[package]
name = "drift-ios"
description = "iOS platform layer for Drift (UIKit): app lifecycle reconnect triggers and the Settings link; later the remote view and input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
drift-apple.workspace = true
drift-core.workspace = true
thiserror.workspace = true

# UIKit exists only on iOS; the crate is empty elsewhere.
[target.'cfg(target_os = "ios")'.dependencies]
block2.workspace = true
dispatch2 = "0.3.1"
tracing.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSNotification", "NSString", "NSURL", "NSDictionary", "NSRunLoop", "NSObjCRuntime", "NSItemProvider", "NSProgress", "NSError", "NSData", "NSArray", "NSDate"] }
objc2-ui-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-quartz-core = { workspace = true, features = ["objc2-core-foundation", "objc2-metal"] }

# UIKit views are main-thread-only; the harness runs every test on the process main thread.
[[test]]
name = "uikit"
harness = false

[[test]]
name = "paste"
harness = false

[[test]]
name = "switcher"
harness = false

[lints]
workspace = true
