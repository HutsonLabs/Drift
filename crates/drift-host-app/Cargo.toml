[package]
name = "drift-host-app"
description = "Drift Host's menu-bar app: status, paired devices, permissions and first-run guidance, start at login."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
drift-host.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[[bin]]
name = "drift-host-app"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dev-dependencies]
drift-apple.workspace = true
drift-core.workspace = true

[lints]
workspace = true

[[test]]
name = "appkit"
harness = false
