name: drift-app
options:
  bundleIdPrefix: com.hutsonlabs.drift
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Drift
      PRODUCT_BUNDLE_IDENTIFIER: com.hutsonlabs.drift
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  drift-app_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # The app icon: the Icon Composer file the Mac app bundles too (APP-icon); actool also
      # renders the flat fallback for iOS before 26.
      - path: ../../icons/AppIcon.icon
        buildPhase: resources
      # Rust's static library is linked (`dependencies` below), never copied into the app; a
      # plain source entry made xcodegen bundle the 900 MB `libapp.a` as a resource (STORE-3).
      - path: Externals
        buildPhase: none
      # Info.plist, entitlements and the privacy manifest (PrivacyInfo.xcprivacy, a resource).
      - path: drift-app_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: drift-app_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Drift connects to hosts on the local network (ADR IOS-0 decision 9).
        NSLocalNetworkUsageDescription: "Drift connects to GNOME Remote Desktop on computers on your local network."
        # host/drift-gnome-setup's link (or its QR code through the Camera app) opens a
        # prefilled New Connection form (ADR GNOME-only).
        CFBundleURLTypes:
          - CFBundleURLName: com.hutsonlabs.drift.connect
            CFBundleURLSchemes: [drift-connect]
        # One scene per session window on iPad (IOS-1, IOS-11); iPhone stays single-scene.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # iPad pointer clicks arrive as pointer touches, not finger touches (IOS-6).
        UIApplicationSupportsIndirectInputEvents: true
        # ProMotion iPhones only go above 60 Hz with this (IOS-4).
        CADisableMinimumFrameDurationOnPhone: true
        # Marketing version yy.mm; the build number grows with every release (`cargo xtask release`).
        CFBundleShortVersionString: "26.10"
        CFBundleVersion: "1"
        # Export compliance: only exempt encryption in Apple's terms — standard algorithms (TLS,
        # CredSSP), mass market, ECCN 5D992 under §740.17(b)(1); the owner files BIS's annual
        # self-classification report (ADR STORE-3-ios-app-store).
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: drift-app_iOS/drift-app_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      # Drift's Rust crates link these; a static library does not carry its link directives
      # (drift-video: VideoToolbox, CoreMedia, CoreVideo, IOSurface; drift-apple: Network;
      # flate2 in the PNG and clipboard paths: libz).
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: IOSurface.framework
      - sdk: Network.framework
      # drift-ios: GCKeyboard and GCMouse (IOS-6).
      - sdk: GameController.framework
      - sdk: libz.tbd
      # drift-apple: the session's sound through AVAudioEngine (HOST-11).
      - sdk: AVFAudio.framework
    preBuildScripts:
      - script: cargo tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a