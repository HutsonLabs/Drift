<?xml version="1.0" encoding="UTF-8"?>
<!--
  Drift's app icon for iPhone and iPad: the waves of icon.svg drawn full bleed on the 1024
  square, because iOS masks the corners itself (and rejects transparency).

  Regenerate the iOS set (src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset): run
  `cargo tauri icon icons/icon-ios.svg -o /tmp/drift-icons` in src-tauri, copy
  /tmp/drift-icons/ios/*.png into the appiconset, and flatten them to opaque RGB (for example
  through `sips -s format jpeg` and back to png). `cargo xtask` checks the result (xtask::icons).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="100 100 824 824">
  <title>Drift</title>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5aa9f7"/>
      <stop offset="0.45" stop-color="#2f6fd6"/>
      <stop offset="1" stop-color="#14306e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824"/>
    </clipPath>
  </defs>

  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#water)"/>
    <rect x="100" y="100" width="824" height="480" fill="url(#sheen)"/>

    <!-- Three waves, each drifting a little further left than the one above it. -->
    <g fill="none" stroke="#ffffff" stroke-width="74" stroke-linecap="round">
      <path opacity="0.97" transform="translate(0 0)"
            d="M -40 392 c 62.5 -78 187.5 -78 250 0 s 187.5 78 250 0 s 187.5 -78 250 0 s 187.5 78 250 0 s 187.5 -78 250 0"/>
      <path opacity="0.78" transform="translate(-64 0)"
            d="M -40 540 c 62.5 -78 187.5 -78 250 0 s 187.5 78 250 0 s 187.5 -78 250 0 s 187.5 78 250 0 s 187.5 -78 250 0"/>
      <path opacity="0.55" transform="translate(-128 0)"
            d="M -40 688 c 62.5 -78 187.5 -78 250 0 s 187.5 78 250 0 s 187.5 -78 250 0 s 187.5 78 250 0 s 187.5 -78 250 0"/>
    </g>
  </g>
</svg>
